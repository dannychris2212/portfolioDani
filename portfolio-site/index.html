<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dani, Product Builder</title>
<meta name="description" content="Dani is a product builder: product owner mindset, builder hands. Projects, case studies and a career laid out like a recording session.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a DAW session. Transport bar on top, project chooser as the cover, each project opens as an arrangement (tracks × phases) with an inspector. Single dark look on purpose. */
:root{
  --ground:#141517; --panel:#1E1F23; --panel-2:#222327; --panel-3:#26272B; --lane-a:#1E1F23; --lane-b:#1B1C1F;
  --line:#0B0C0D; --hair:#34353A; --ink:#F4F4F5; --ink-2:#DCDDE0; --ink-3:#B4B5BA; --ink-4:#8E9096; --lcd:#0E0F10; --on-color:#141414;
  --amber:#E9A23B; --coral:#E5735F; --teal:#3FB8A3; --slate:#7E9CCB; --violet:#9D8BF2; --sky:#5FA8E8; --rose:#E07FB0; --rec:#E5534B;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ground);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--amber)}a:hover{color:var(--ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.mono{font-family:var(--mono)}

/* transport */
.transport{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--panel-3);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 16px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.02em;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand span{color:var(--amber)}
.tbtns{display:flex;gap:6px}
.tbtn{width:44px;height:36px;border:none;border-radius:4px;background:var(--hair);display:flex;align-items:center;justify-content:center;cursor:pointer}
.tbtn svg{width:14px;height:14px;fill:var(--ink-2)}
.tbtn.on{background:var(--amber)} .tbtn.on svg{fill:var(--on-color)}
.lcd{background:var(--lcd);border-radius:4px;padding:8px 14px;font-family:var(--mono);font-size:13px;color:var(--amber);font-variant-numeric:tabular-nums;flex:1 1 280px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.songs{display:flex;gap:4px}
.song{font-family:var(--mono);font-size:12px;padding:8px 10px;border-radius:4px;border:none;cursor:pointer;background:var(--panel);color:var(--ink-3);min-height:36px}
.song[aria-pressed="true"]{background:var(--amber);color:var(--on-color)}
.navlinks{display:flex;gap:16px;font-family:var(--mono);font-size:13px;margin-left:auto}
.navlinks a{color:var(--ink-3);text-decoration:none}.navlinks a:hover{color:var(--ink)}

main{padding-inline:16px;padding-block:24px 40px;max-width:1440px;margin:0 auto}

/* cover */
.window{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid;grid-template-columns:240px minmax(0,1fr)}
.winbar{grid-column:1/-1;height:40px;background:var(--panel-3);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-family:var(--mono);font-size:12px;color:var(--ink-4)}
.cats{background:var(--panel-2);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px}
.cat{text-align:left;border:none;border-radius:6px;padding:10px 12px;cursor:pointer;background:transparent;color:var(--ink-2);font-weight:500;display:flex;justify-content:space-between;min-height:44px;align-items:center}
.cat .n{font-family:var(--mono);font-size:12px;opacity:.7}
.cat[aria-pressed="true"]{background:var(--amber);color:var(--on-color)}
.chooser{padding:28px 32px 32px;display:flex;flex-direction:column;gap:28px;min-width:0}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.hero h1{margin:0;font-weight:600;font-size:clamp(28px,4vw,44px);line-height:1.1;max-width:18ch;text-wrap:balance}
.hero p{margin:10px 0 0;color:var(--ink-3);max-width:52ch}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{text-decoration:none;color:var(--ink);background:var(--panel-3);border:1px solid var(--hair);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s ease,border-color .15s ease}
a.card:hover{transform:translateY(-2px);border-color:var(--c)}
.card .art{height:108px;background:var(--c);position:relative;padding:12px 14px;display:flex;align-items:flex-end;gap:4px}
.card .art i{display:block;height:14px;background:var(--on-color);opacity:.5;border-radius:2px}
.card .art .k{position:absolute;top:10px;left:14px;font-family:var(--mono);font-size:11px;font-weight:500;color:var(--on-color)}
.card .tx{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{margin:0;font-size:19px;font-weight:600}
.card p{margin:0;font-size:14px;color:var(--ink-3);line-height:1.45}
.card .res{font-family:var(--mono);font-size:12px;color:var(--c);margin-top:auto;padding-top:6px}
.card.static{cursor:default}

/* session */
.session{display:grid;grid-template-columns:300px minmax(0,1fr);background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.side{background:var(--panel-2);border-right:1px solid var(--line);padding:22px;display:flex;flex-direction:column;gap:18px;min-width:0}
.back{font-family:var(--mono);font-size:13px;color:var(--ink-3);text-decoration:none}
.side h2{margin:0;font-family:var(--display);font-weight:800;font-size:54px;line-height:.9;text-transform:uppercase}
.side .sum{margin:0;color:var(--ink-2)}
.side .meta{font-family:var(--mono);font-size:12px;color:var(--ink-3);line-height:1.6}
.inspector{background:#2B2C31;border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:10px;border-top:4px solid var(--c);scroll-margin-top:80px}
.inspector h3{margin:0;font-size:20px;font-weight:600}
.inspector p{margin:0;font-size:14px;line-height:1.6;color:var(--ink-2)}
.inspector .res{font-family:var(--mono);font-size:12px;line-height:1.5;color:var(--on-color);background:var(--c);padding:6px 8px;border-radius:3px;align-self:flex-start}
.inspector a{font-family:var(--mono);font-size:13px}
.hint{font-family:var(--mono);font-size:12px;color:var(--ink-4)}
.demo{display:block;width:100%;max-height:460px;object-fit:contain;border-radius:8px;background:#000;border:1px solid var(--hair)}
.tagdemo{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.06em;background:var(--on-color);color:var(--c);padding:1px 5px;border-radius:3px;align-self:flex-start}
.region.ghost .tagdemo{display:none}
.arrange{min-width:0;display:flex;flex-direction:column}
.ruler{display:grid;grid-template-columns:170px minmax(0,1fr);height:32px;background:var(--panel-2);border-bottom:1px solid var(--line)}
.ruler .gutter{border-right:1px solid var(--line)}
.ticks{position:relative}
.tick{position:absolute;top:8px;font-family:var(--mono);font-size:11px;color:var(--ink-4);padding-left:5px;border-left:1px solid #45464C;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.lanes{position:relative}
.lane{display:grid;grid-template-columns:170px minmax(0,1fr);border-bottom:1px solid var(--line);min-height:var(--h,104px)}
.lane:nth-child(odd) .track{background:var(--lane-a)} .lane:nth-child(even) .track{background:var(--lane-b)}
.head{background:var(--panel-3);border-right:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.head .nm{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.head .nm i{width:10px;height:10px;border-radius:2px;background:var(--c);display:block}
.head .sub{font-family:var(--mono);font-size:11px;color:var(--ink-4)}
.track{position:relative;min-width:0}
.region{position:absolute;top:10px;bottom:10px;border:none;border-radius:4px;background:var(--c);color:var(--on-color);padding:8px 10px;text-align:left;font-size:13px;font-weight:600;line-height:1.3;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.region .pat{height:16px;width:100%;opacity:.5;background:repeating-linear-gradient(90deg,var(--on-color) 0 10px,transparent 10px 16px)}
.region.audio .pat{background:repeating-linear-gradient(90deg,var(--on-color) 0 2px,transparent 2px 5px)}
.region.ghost{background:transparent;color:var(--ink-2);border:2px dashed var(--c)}
.region.ghost .pat{display:none}
.region[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.region .ph{display:none}
.wave{height:28px;display:flex;align-items:center;gap:2px;width:100%}
.wave span{flex:1 1 0;border-radius:1px;background:rgba(20,20,20,.4)}
.wave span.done{background:var(--on-color)}
.now{position:absolute;top:-32px;bottom:0;width:0;border-left:2px dashed var(--ink-4);pointer-events:none}
.playhead{position:absolute;top:-32px;bottom:0;width:2px;background:var(--ink);pointer-events:none;transition:left .25s linear}
.flag{position:absolute;top:-30px;background:var(--ink);color:var(--ground);font-family:var(--mono);font-size:10px;font-weight:500;padding:2px 6px;border-radius:2px;pointer-events:none;margin-left:3px}
.trackarea{position:absolute;top:0;bottom:0;left:170px;right:0;pointer-events:none}

footer{margin-top:28px;display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--ink-3)}
footer a{color:var(--ink-3)}

@media (max-width:860px){
  .window{grid-template-columns:1fr}
  .cats{flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);padding:12px}
  .cat{flex:0 0 auto;gap:10px}
  .chooser{padding:20px 16px}
  .session{grid-template-columns:1fr}
  .side{border-right:none;border-bottom:1px solid var(--line)}
  .ruler,.now,.playhead,.flag,.trackarea{display:none}
  .lane{grid-template-columns:1fr;min-height:0}
  .head{border-right:none;border-bottom:1px solid var(--line);flex-direction:row;align-items:center}
  .track{display:flex;flex-direction:column;gap:8px;padding:10px}
  .region{position:static;width:auto!important;min-height:64px}
  .region .ph{display:block;font-family:var(--mono);font-size:11px;font-weight:500;opacity:.75}
  .navlinks{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

</head>
<body>
<header class="transport">
  <a class="brand" href="#home">Dani <span>· Product builder</span></a>
  <div class="tbtns">

    <button class="tbtn" id="play" type="button" aria-label="Play one of my songs"><svg viewBox="0 0 24 24" id="playIcon"><path d="M7 4v16l13-8z"/></svg></button>

</header>

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (m) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[m]);
const app = $('#app');
const audio = $('#audio');
const state = { cat:'all', sel:{}, song:0, prog:0 };
const DEFAULT_LCD = '1 SaaS in production · ~2,250 customers · 5,700+ orders';
const fmt = (v) => { const n = Math.floor(v || 0); return Math.floor(n/60) + ':' + String(n%60).padStart(2,'0'); };

function footer(){
  return `<footer id="contact">
    <span>Guitar · drums · vocals · more of my music: <a href="https://open.spotify.com/track/3VQI56IlPcjq0XFngjt89r" target="_blank" rel="noopener">So Bad</a> · <a href="https://open.spotify.com/track/5g4y3YAr6j24iCa0gELErv" target="_blank" rel="noopener">Vem Só</a></span>
    <span><a href="https://www.linkedin.com/in/daniela-christina-andrade-e-silva-7527403ba" target="_blank" rel="noopener">LinkedIn</a> · <a href="https://github.com/dannychris2212" target="_blank" rel="noopener">GitHub</a> · <a href="mailto:danielachristina.producao@gmail.com">danielachristina.producao@gmail.com</a></span>
  </footer>`;
}

function renderHome(){
  const cards = state.cat === 'all' ? CARDS : CARDS.filter((c) => c.cat === state.cat);
  app.innerHTML = `
  <section class="window" aria-label="Projects">
    <div class="winbar"><span>Choose a project</span><span>${cards.length} sessions</span></div>
    <div class="cats" role="group" aria-label="Filter projects">
      ${CATS.map(([id,label]) => `<button class="cat" type="button" data-cat="${id}" aria-pressed="${state.cat===id}"><span>${label}</span><span class="n">${id==='all'?CARDS.length:CARDS.filter((c)=>c.cat===id).length}</span></button>`).join('')}
    </div>
    <div class="chooser">
      <div class="hero">
        <div>
          <span class="kicker">Product builder · product owner mindset</span>
          <h1>I turn messy operations into products people use.</h1>
          <p>Self-taught builder who came up through support and operations. I find the problem, design the product and ship it. Open a project to see how it was built.</p>
        </div>
      </div>
      <div class="cards">
        ${cards.map((p) => {
          const art = `<div class="art"><span class="k">${p.kind}</span>${p.bars.map(([w,y]) => `<i style="width:${w}px;margin-bottom:${y}px"></i>`).join('')}</div>`;
          const tx = `<div class="tx"><h3>${esc(p.title)}</h3><p>${esc(p.line)}</p><span class="res">${esc(p.res)}</span></div>`;
          return p.href
            ? `<a class="card" style="--c:${p.c}" href="${p.href}"${p.ext?' target="_blank" rel="noopener"':''}>${art}${tx}</a>`
            : `<div class="card static" style="--c:${p.c}">${art}${tx}</div>`;
        }).join('')}
      </div>
    </div>
  </section>${footer()}`;
  app.querySelectorAll('.cat').forEach((b) => b.addEventListener('click', () => { state.cat = b.dataset.cat; renderHome(); }));
}

function renderSession(key){
  const s = SESSIONS[key];
  const sel = state.sel[key] || s.first;
  let cur = null, curC = null, curL = '';
  s.lanes.forEach((l) => l.regions.forEach((r) => { if (r.id === sel) { cur = r; curC = l.c; curL = l.name; } }));
  const pos = (r) => s.career ? `left:${r.x*s.unit}%;width:calc(${r.w*s.unit}% - 4px)` : `left:calc(${r.x*s.unit}% + 4px);width:calc(${r.w*s.unit}% - 8px)`;
  const phase = (r) => r.ph || (s.career ? '' : s.ticks[Math.min(4, Math.floor(r.x))].label);
  app.innerHTML = `
  <section class="session" aria-label="${esc(s.title)} session">
    <aside class="side">
      <a class="back" href="#home">← All projects</a>
      <div style="display:flex;flex-direction:column;gap:8px">
        <h2>${esc(s.title)}</h2>
        <p class="sum">${esc(s.sum)}</p>
        <span class="meta">${s.meta}</span>
      </div>
      <div class="inspector" id="inspector" style="--c:${curC}">
        <span class="kicker">${esc(curL + (phase(cur) ? ' · ' + phase(cur) : ''))}</span>
        <h3>${esc(cur.t)}</h3>
        <p>${esc(cur.b)}</p>
        ${cur.r ? `<span class="res">${esc(cur.r)}</span>` : ''}
        ${cur.v ? `<video class="demo" src="${cur.v}" autoplay muted loop playsinline preload="metadata" aria-label="Screen recording: ${esc(cur.t)}"></video>` : ''}
        ${cur.link ? `<a href="${cur.link}"${cur.link.startsWith('http')?' target="_blank" rel="noopener"':''}>${esc(cur.lt)}</a>` : ''}
      </div>
      <span class="hint">Select a region to read its notes. DEMO regions play a screen recording; dashed ones are what comes next.</span>
    </aside>
    <div class="arrange">
      <div class="ruler" aria-hidden="true"><div class="gutter"></div><div class="ticks">${s.ticks.map((t) => `<span class="tick" style="left:${t.at}%">${t.label}</span>`).join('')}</div></div>
      <div class="lanes">
        ${s.lanes.map((l) => `
        <div class="lane" style="--c:${l.c};--h:${l.h||104}px">
          <div class="head"><span class="nm"><i></i>${esc(l.name)}</span><span class="sub">${esc(l.sub)}</span></div>
          <div class="track">
            ${l.regions.map((r) => `<button class="region${r.ghost?' ghost':''}${l.audio?' audio':''}" type="button" data-id="${r.id}" aria-pressed="${r.id===sel}" style="${pos(r)}">
              <span>${esc(r.t)}</span>${r.v ? '<span class="tagdemo">DEMO</span>' : ''}<span class="ph">${esc(phase(r))}</span>
              ${r.wave ? `<span class="wave" id="wave">${SONGS[state.song].peaks.map((v) => `<span style="height:${Math.max(8, Math.round(v*100))}%"></span>`).join('')}</span>` : '<span class="pat"></span>'}
            </button>`).join('')}
          </div>
        </div>`).join('')}
        <div class="trackarea" aria-hidden="true">
          ${s.now != null ? `<div class="now" style="left:${s.now}%"></div><span class="flag" style="left:${s.now}%">NOW</span>` : ''}
          ${s.career ? `<div class="playhead" id="playhead" style="left:${s.now}%"></div>` : ''}
        </div>
      </div>
    </div>
  </section>${footer()}`;
  app.querySelectorAll('.region').forEach((b) => b.addEventListener('click', () => {
    state.sel[key] = b.dataset.id; renderSession(key);
    if (window.matchMedia('(max-width:860px)').matches) { const ins = $('#inspector'); if (ins) ins.scrollIntoView({ behavior:'smooth', block:'start' }); }
  }));
  setLcd(); paintProgress();
}

function route(){
  const h = location.hash.replace('#','');
  if (h === 'ptt') { state.sel.career = 'ptt'; renderSession('career'); }
  else if (SESSIONS[h]) renderSession(h);
  else if (h === 'contact') { renderHome(); const f = $('#contact'); if (f) f.scrollIntoView(); }
  else renderHome();
  if (h !== 'contact') window.scrollTo(0, 0);
}

/* audio */
const playBtn = $('#play'), playIcon = $('#playIcon');
function setLcd(){
  const h = location.hash.replace('#','');
  const base = (SESSIONS[h] && SESSIONS[h].lcd) || DEFAULT_LCD;
  $('#lcd').textContent = audio.duration && (state.prog > 0 || !audio.paused) ? `♪ ${SONGS[state.song].title} · ${fmt(audio.currentTime)} / ${fmt(audio.duration)}` : base;
}
function paintProgress(){
  const wave = $('#wave');
  if (wave) { const kids = wave.children, n = kids.length; for (let i = 0; i < n; i++) kids[i].classList.toggle('done', i / n < state.prog); }
  const ph = $('#playhead');
  if (ph) { const now = SESSIONS.career.now; ph.style.left = (state.prog > 0 || !audio.paused ? now * state.prog : now) + '%'; }
}
function setPlaying(on){
  playBtn.classList.toggle('on', on);
  playBtn.setAttribute('aria-label', on ? 'Pause the song' : 'Play one of my songs');
  playIcon.innerHTML = on ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>' : '<path d="M7 4v16l13-8z"/>';
}
function loadSong(i){
  state.song = i; state.prog = 0; audio.src = SONGS[i].src;
  document.querySelectorAll('.song').forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.song) === i)));
  const h = location.hash.replace('#',''); if (h === 'career') renderSession('career');
}
playBtn.addEventListener('click', () => {
  if (!audio.src) audio.src = SONGS[state.song].src;
  if (audio.paused) audio.play().catch(() => setPlaying(false)); else audio.pause();
});
$('#restart').addEventListener('click', () => { audio.currentTime = 0; state.prog = 0; paintProgress(); setLcd(); });
document.querySelectorAll('.song').forEach((b) => b.addEventListener('click', () => {
  const wasPlaying = !audio.paused; loadSong(Number(b.dataset.song)); if (wasPlaying) audio.play().catch(() => setPlaying(false));
}));
audio.addEventListener('play', () => setPlaying(true));
audio.addEventListener('pause', () => { setPlaying(false); setLcd(); });
audio.addEventListener('ended', () => { state.prog = 1; paintProgress(); setLcd(); });
audio.addEventListener('timeupdate', () => { state.prog = audio.duration ? audio.currentTime / audio.duration : 0; paintProgress(); setLcd(); });

window.addEventListener('hashchange', route);
route();
</script>
